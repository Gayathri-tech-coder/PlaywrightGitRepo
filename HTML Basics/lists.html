<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in HTML</title>
</head>
<body>
    <h1>Unordered List</h1>
    <ul>
        <li>FrontEnd</li>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
            </ul>
        <li>Backend</li>
            <ol>
                <li>Python</li>
                <li>Java</li>
            </ol>
    </ul>
    <h1>Ordered List</h1>
    <ol>
        <li>Programming Languages</li>
        <li>Frontend Languages</li>
    </ol>
</body>
</html>

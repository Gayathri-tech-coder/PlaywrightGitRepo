<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in HTML</title>
</head>
<body>
    <h1>Student Information</h1>
    <table border="1" align="center">
        <tr>
            <th>Std_Id</th>
            <th>Student Name</th>
            <th>Course</th>
        </tr>
        <tr>
            <td>101</td>
            <td>John</td>
            <td>Java</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Kiran</td>
            <td>Testing</td>
        </tr>
        <tr>
            <td>103</td>
            <td>Dennis</td>
            <td>Java</td>
        </tr>
        <tr>
            <td>104</td>
            <td>Lalitha</td>
            <td>Python</td>
        </tr>
        <tr>
            <td colspan="2">Total Students</td>
            <td>4</td>
        </tr>
    </table>
</body>
</html>
